---
env_name: example
timezone: America/Sao_Paulo

# Real values come from infra-ansible-inventory's ansible-vault. These
# environment-variable fallbacks exist only so this example inventory can be
# used for optional local live validation without a private inventory.
pve_host: "{{ lookup('ansible.builtin.env', 'PVE_HOST', default='') }}"
pve_token_id: "{{ lookup('ansible.builtin.env', 'PVE_TOKEN_ID', default='') }}"
pve_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_TOKEN_SECRET', default='') }}"

minio_endpoint_url: https://minio.example.invalid
minio_region: us-east-1
minio_use_path_style: true
minio_validate_access: false
minio_access_key: "{{ lookup('ansible.builtin.env', 'OBJECT_STORAGE_ACCESS_KEY', default='') }}"
minio_secret_key: "{{ lookup('ansible.builtin.env', 'OBJECT_STORAGE_SECRET_KEY', default='') }}"
minio_buckets:
  artifacts: infra-artifacts
  backups: infra-backups
  validation: infra-validation

bootstrap_repo_ref: main
bootstrap_check_git_ref: false

proxmox_expected_templates:
  - tpl-debian-13-cloudinit
  - tpl-almalinux-10-cloudinit
  - tpl-ubuntu-26-04-cloudinit
  - tpl-win11-24h2
