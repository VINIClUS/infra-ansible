---
- name: Validate router extension activation
  ansible.builtin.assert:
    that:
      - samba_ad_router_nic_enabled is boolean
      - samba_ad_router_nic_apply is boolean
      - samba_ad_router_nic_console_verified is boolean
      - samba_ad_router_nic_qga_recovery is boolean

- name: Stop the disabled router extension
  ansible.builtin.meta: end_role
  when: not samba_ad_router_nic_enabled

- name: Require one exact manual router node and selected management recovery
  ansible.builtin.assert:
    that:
      - ansible_limit is defined
      - ansible_limit | trim == inventory_hostname
      - ansible_play_hosts_all | length == 1
      - ansible_run_tags | list | sort == ['samba_ad_router_nic']
      - samba_ad_router_nic_request.node == ansible_facts.hostname
      - samba_ad_router_nic_guest_host in hostvars
      - samba_ad_router_nic_console_verified or samba_ad_router_nic_qga_recovery
      - samba_ad_router_nic_state_root == '/root/samba-ad-s1-router'
      - samba_ad_router_nic_deadman_minutes | int >= 3
      - samba_ad_router_nic_deadman_minutes | int <= 30
    fail_msg: >-
      Use the exact PVE node, private request, dedicated tag and verified console
      or selected PVE/QGA management recovery.

- name: Read and validate QEMU identity digest and all existing NICs
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/samba_ad/router_nic.py') }}"
      - --plan
    stdin: "{{ samba_ad_router_nic_request | to_json }}"
  register: samba_ad_router_nic_plan_raw
  changed_when: false
  check_mode: false
  no_log: true

- name: Parse the router extension plan
  ansible.builtin.set_fact:
    samba_ad_router_nic_plan: "{{ samba_ad_router_nic_plan_raw.stdout | from_json }}"
  no_log: true

- name: Capture guest interface address and route inventory through a fresh connection
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/samba_ad/router_state.py') }}"
      - --snapshot
  vars:
    ansible_ssh_args: >-
      -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes
      -o IdentityAgent=none -o IdentitiesOnly=yes
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  register: samba_ad_router_nic_snapshot
  changed_when: false
  check_mode: false
  no_log: true

- name: Check whether an earlier protected network baseline still exists
  ansible.builtin.stat:
    path: /root/samba-ad-s1-network/before.json
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  register: samba_ad_router_nic_baseline_file

- name: Refuse to reuse an earlier baseline for a new extension
  ansible.builtin.assert:
    that:
      - samba_ad_router_nic_plan.action == 'verify' or not samba_ad_router_nic_baseline_file.stat.exists
    fail_msg: "A prior S1 network baseline exists; review technical recovery before a new extension."

- name: Use the pre-mutation snapshot only for a new interface
  ansible.builtin.set_fact:
    samba_ad_router_nic_baseline: "{{ samba_ad_router_nic_snapshot.stdout | from_json }}"
  when: samba_ad_router_nic_plan.action == 'add'
  no_log: true

- name: Load the protected original network baseline for reexecution
  ansible.builtin.slurp:
    src: /root/samba-ad-s1-network/before.json
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  register: samba_ad_router_nic_saved_baseline
  when: samba_ad_router_nic_plan.action == 'verify'
  no_log: true

- name: Keep reexecution bound to the original network baseline
  ansible.builtin.set_fact:
    samba_ad_router_nic_baseline: "{{ samba_ad_router_nic_saved_baseline.content | b64decode | from_json }}"
  when: samba_ad_router_nic_plan.action == 'verify'
  no_log: true

- name: Validate absence or live state without repairing drift
  ansible.builtin.include_tasks: readback.yml
  vars:
    samba_ad_router_nic_readback_phase: "{{ 'absent' if samba_ad_router_nic_plan.action == 'add' else 'verify' }}"

- name: Read the dedicated network file
  ansible.builtin.stat:
    path: /etc/systemd/network/05-samba-ad-identity.network
    checksum_algorithm: sha256
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  register: samba_ad_router_nic_file

- name: Refuse an occupied file or a partial earlier extension
  ansible.builtin.assert:
    that:
      - >-
        (samba_ad_router_nic_plan.action == 'add' and not samba_ad_router_nic_file.stat.exists)
        or (samba_ad_router_nic_plan.action == 'verify' and samba_ad_router_nic_file.stat.exists
            and samba_ad_router_nic_file.stat.checksum == (samba_ad_router_nic_plan.network | hash('sha256')))
    fail_msg: "Existing or partial network state requires exact technical recovery before reexecution."

- name: Prove the selected independent PVE to QGA root management path before mutation
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/samba_ad/router_nic.py') }}"
      - --plan
      - --qga-preflight
    stdin: "{{ samba_ad_router_nic_request | to_json }}"
  vars:
    ansible_ssh_args: >-
      -o BatchMode=yes -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes
      -o UpdateHostKeys=no -o IdentityAgent=none -o IdentitiesOnly=yes
  changed_when: false
  check_mode: false
  no_log: true
  when: samba_ad_router_nic_qga_recovery

- name: Apply one additional interface under independent PVE and guest dead-man timers
  ansible.builtin.include_tasks: apply.yml
  when:
    - samba_ad_router_nic_apply
    - not ansible_check_mode
    - samba_ad_router_nic_plan.action == 'add'

- name: Report router extension outcome
  ansible.builtin.debug:
    msg: "S1 QEMU NIC={{ samba_ad_router_nic_plan.action }}; existing interfaces preserved."
