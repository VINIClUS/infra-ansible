---
- name: Refuse an outstanding PVE router extension timer
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, samba-ad-router-nic-deadman.timer]
  register: samba_ad_router_nic_timer
  changed_when: false
  failed_when: samba_ad_router_nic_timer.rc == 0

- name: Refuse an outstanding guest extension timer
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, samba-ad-router-network-deadman.timer]
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  register: samba_ad_router_nic_network_timer
  changed_when: false
  failed_when: samba_ad_router_nic_network_timer.rc == 0

- name: Create root-only PVE recovery directory
  ansible.builtin.file:
    path: "{{ samba_ad_router_nic_state_root }}"
    state: directory
    mode: "0700"

- name: Save the exact request for digest-guarded NIC recovery
  ansible.builtin.copy:
    content: "{{ samba_ad_router_nic_request | to_nice_json }}"
    dest: "{{ samba_ad_router_nic_state_root }}/request.json"
    mode: "0600"
  no_log: true

- name: Save the dedicated recovery program on the router node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tools/samba_ad/router_nic.py"
    dest: "{{ samba_ad_router_nic_state_root }}/router_nic.py"
    mode: "0700"

- name: Preserve PVE router configuration before the extension
  ansible.builtin.command:
    argv:
      - sh
      - -ec
      - >-
        umask 077; pvesh get
        /nodes/{{ samba_ad_router_nic_request.node }}/qemu/{{ samba_ad_router_nic_request.vmid }}/config
        --output-format json > /root/samba-ad-s1-router/config-before.json
  changed_when: false
  no_log: true

- name: Create root-only guest network recovery directory
  ansible.builtin.file:
    path: /root/samba-ad-s1-network
    state: directory
    mode: "0700"
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"

- name: Preserve original interfaces addresses and routes for future readonly verification
  ansible.builtin.copy:
    content: "{{ samba_ad_router_nic_baseline | to_nice_json }}"
    dest: /root/samba-ad-s1-network/before.json
    mode: "0600"
    force: false
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  no_log: true

- name: Preserve existing persistent network files for console recovery
  ansible.builtin.command:
    argv:
      - sh
      - -ec
      - >-
        umask 077; tar --create --file /root/samba-ad-s1-network/network-before.tar
        --directory=/ etc/systemd/network etc/netplan
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  changed_when: false

- name: Install technical recovery for only the owned guest interface
  ansible.builtin.copy:
    dest: /root/samba-ad-s1-network/revert.sh
    mode: "0700"
    content: |
      #!/bin/sh
      set -eu
      # The embedded program checks both hashes and metadata before any mutation.
      python3 -c \
        {{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/samba_ad/router_policy.py') | quote }} \
        <<'S1_ROUTER_POLICY'
      {{ {'request': samba_ad_router_nic_request, 'network': samba_ad_router_nic_plan.network,
          'operation': 'rollback'} | to_json }}
      S1_ROUTER_POLICY
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"

- name: Arm guest technical network recovery before adding any NIC
  ansible.builtin.command:
    argv:
      - sh
      - -ec
      - >-
        systemctl reset-failed samba-ad-router-network-deadman.service 2>/dev/null || true;
        systemd-run --unit=samba-ad-router-network-deadman
        --on-active={{ samba_ad_router_nic_deadman_minutes | int }}min
        /bin/sh /root/samba-ad-s1-network/revert.sh;
        systemctl is-active --quiet samba-ad-router-network-deadman.timer
  delegate_to: "{{ samba_ad_router_nic_guest_host }}"
  changed_when: true

- name: Arm the existing PVE change guard for exact NIC removal
  ansible.builtin.include_role:
    name: proxmox_change_guard
    tasks_from: deadman.yml
  vars:
    proxmox_change_guard_action: arm
    proxmox_change_guard_nodes: "{{ {ansible_facts.hostname: ansible_host} }}"
    proxmox_change_guard_deadman_unit: samba-ad-router-nic-deadman
    proxmox_change_guard_deadman_minutes: "{{ samba_ad_router_nic_deadman_minutes }}"
    proxmox_change_guard_deadman_description: Revert only the additional Samba router NIC
    proxmox_change_guard_revert_command: >-
      python3 /root/samba-ad-s1-router/router_nic.py --revert < /root/samba-ad-s1-router/request.json

- name: Extend and verify the router without changing existing interfaces
  block:
    - name: Install and read back the MAC-bound naming and network policies before hotplug
      ansible.builtin.include_tasks: policy.yml
      vars:
        samba_ad_router_nic_policy_operation: install

    - name: Hotplug only the declared additional QEMU NIC
      ansible.builtin.command:
        argv: [python3, /root/samba-ad-s1-router/router_nic.py]
        stdin: "{{ samba_ad_router_nic_request | to_json }}"
      register: samba_ad_router_nic_apply_result
      changed_when: >-
        (samba_ad_router_nic_apply_result | samba_ad_router_nic_result('apply')).mutation_attempted is not sameas false
      no_log: true

    - name: Require verified safe hotplug evidence before continuing
      ansible.builtin.assert:
        that:
          - (samba_ad_router_nic_apply_result | samba_ad_router_nic_result('apply')).success
        quiet: true
        fail_msg: "NIC helper evidence is missing or invalid; recovery remains required."

    - name: Wait for the new device then prove MAC PCI identity and unchanged old network
      ansible.builtin.include_tasks: readback.yml
      vars:
        samba_ad_router_nic_readback_phase: preconfigure

    - name: Revalidate device identity immediately before reconfiguring only the new device
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/samba_ad/router_state.py') }}"
          - --reconfigure
        stdin: >-
          {{ {'request': samba_ad_router_nic_request, 'baseline': samba_ad_router_nic_baseline} | to_json }}
      delegate_to: "{{ samba_ad_router_nic_guest_host }}"
      changed_when: true
      no_log: true

    - name: Verify live address prefix MAC MTU link and original routes through a fresh connection
      ansible.builtin.include_tasks: readback.yml

    - name: Verify both owned persistent NIC files before disarming recovery
      ansible.builtin.include_tasks: policy.yml
      vars:
        samba_ad_router_nic_policy_operation: verify

    - name: Read current PVE digest after guest verification
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ samba_ad_router_nic_request.node }}/qemu/{{ samba_ad_router_nic_request.vmid }}/config"
          - --current
          - "1"
          - --output-format
          - json
      register: samba_ad_router_nic_final_config
      changed_when: false
      no_log: true

    - name: Verify all QEMU interfaces and pending state before disarming recovery
      ansible.builtin.command:
        argv: [python3, /root/samba-ad-s1-router/router_nic.py, --plan]
        stdin: >-
          {{ samba_ad_router_nic_request
             | combine({'expected_digest': (samba_ad_router_nic_final_config.stdout | from_json).digest}) | to_json }}
      changed_when: false
      no_log: true

    - name: Disarm guest recovery only after fresh connection readback
      ansible.builtin.command:
        argv:
          - sh
          - -ec
          - >-
            systemctl stop samba-ad-router-network-deadman.timer;
            ! systemctl is-active --quiet samba-ad-router-network-deadman.timer
      delegate_to: "{{ samba_ad_router_nic_guest_host }}"
      changed_when: true

    - name: Disarm PVE recovery only after guest verification
      ansible.builtin.include_role:
        name: proxmox_change_guard
        tasks_from: deadman.yml
      vars:
        proxmox_change_guard_action: disarm
        proxmox_change_guard_nodes: "{{ {ansible_facts.hostname: ansible_host} }}"
        proxmox_change_guard_deadman_unit: samba-ad-router-nic-deadman

  rescue:
    - name: Revert only the additional guest interface
      ansible.builtin.command:
        argv: [sh, /root/samba-ad-s1-network/revert.sh]
      delegate_to: "{{ samba_ad_router_nic_guest_host }}"
      register: samba_ad_router_nic_guest_recovery_result
      changed_when: samba_ad_router_nic_guest_recovery_result.rc | default(-1) == 0
      failed_when: false
      no_log: true

    - name: Remove only the exact additional QEMU NIC
      ansible.builtin.command:
        argv:
          - sh
          - -ec
          - >-
            python3 /root/samba-ad-s1-router/router_nic.py --revert
            < /root/samba-ad-s1-router/request.json
      register: samba_ad_router_nic_recovery_result
      changed_when: >-
        (samba_ad_router_nic_recovery_result
         | samba_ad_router_nic_result('revert')).mutation_attempted is not sameas false
      failed_when: false
      no_log: true

    - name: Fail with timers retained for unreachable endpoints
      ansible.builtin.fail:
        msg: >-
          S1 extension failed; exact-interface recovery attempted; timers remain armed.
          Hotplug={{ samba_ad_router_nic_apply_result | default({}) | samba_ad_router_nic_result('apply') | to_json }}.
          Guest recovery={{ samba_ad_router_nic_guest_recovery_result | default({})
            | samba_ad_router_command_result | to_json }}.
          NIC recovery={{ samba_ad_router_nic_recovery_result | default({})
            | samba_ad_router_nic_result('revert') | to_json }}.
          Use the verified console or independent PVE/QGA management recovery.
