---
- name: Install the fixed dispatcher only when explicitly enabled
  when: personal_platform_dispatcher_enabled | bool
  block:
    - name: Require governed configuration and exact runtime checksum
      ansible.builtin.assert:
        that:
          - personal_platform_delivery_enabled | default(false) | bool
          - ansible_limit | default('') == inventory_hostname
          - personal_platform_dispatcher_user == 'personal-cnesdata-deploy'
          - personal_platform_host_governance.runtime_sha256 is match('^[0-9a-f]{64}$')
          - personal_platform_host_governance.enabled | bool
    - name: Create root-owned boundary directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/personal-platform
        - /var/lib/personal-platform/deployments
        - /usr/local/lib/personal-platform
        - /run/personal-platform
        - /run/personal-platform/staging
    - name: Install the self-contained runtime from this exact checkout
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tools/cnesdata_delivery/host_gate.py"
        dest: /usr/local/lib/personal-platform/host_gate.py
        owner: root
        group: root
        mode: "0600"
    - name: Read back the installed runtime checksum
      ansible.builtin.stat:
        path: /usr/local/lib/personal-platform/host_gate.py
        checksum_algorithm: sha256
      register: personal_platform_dispatcher_installed_runtime
    - name: Install the integrated EXT1 cost validator in the declared closure
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tools/cnesdata_delivery/contract.py"
        dest: /usr/local/lib/personal-platform/contract.py
        owner: root
        group: root
        mode: "0600"
    - name: Require the independently approved installed bytes
      ansible.builtin.assert:
        that:
          - >-
            personal_platform_dispatcher_installed_runtime.stat.checksum ==
            personal_platform_host_governance.runtime_sha256
    - name: Install the private original governed handoff
      ansible.builtin.copy:
        content: "{{ personal_platform_host_governance | to_json }}\n"
        dest: /etc/personal-platform/host-gate.json
        owner: root
        group: root
        mode: "0600"
      no_log: true
    - name: Create the isolated forced-command account
      ansible.builtin.user:
        name: "{{ personal_platform_dispatcher_user }}"
        create_home: true
        shell: /bin/sh
        password_lock: true
        groups: ""
    - name: Require the deploy public key for the forced-command account
      ansible.builtin.assert:
        that:
          - personal_platform_dispatcher_authorized_key is string
          - personal_platform_dispatcher_authorized_key is match('^ssh-ed25519 AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/]{48}$')
        fail_msg: Provision the ed25519 deploy public key before installing the dispatcher.
    - name: Install only the deploy public key for the forced-command account
      ansible.posix.authorized_key:
        user: "{{ personal_platform_dispatcher_user }}"
        key: "{{ personal_platform_dispatcher_authorized_key }}"
        exclusive: true
        manage_dir: true
    - name: Install the exact sudo boundary
      ansible.builtin.copy:
        content: |
          Defaults:personal-cnesdata-deploy env_keep += "SSH_ORIGINAL_COMMAND"
          personal-cnesdata-deploy ALL=(root) NOPASSWD: \
            /usr/bin/python3 -I /usr/local/lib/personal-platform/host_gate.py --host
        dest: /etc/sudoers.d/personal-platform-dispatcher
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
    - name: Install the restricted SSH match block
      ansible.builtin.copy:
        content: |
          Match User personal-cnesdata-deploy
              ForceCommand sudo -n /usr/bin/python3 -I /usr/local/lib/personal-platform/host_gate.py --host
              PermitTTY no
              AllowTcpForwarding no
              AllowAgentForwarding no
              X11Forwarding no
              PermitTunnel no
              PermitUserRC no
              PasswordAuthentication no
          Match all
        dest: /etc/ssh/sshd_config.d/60-personal-platform-dispatcher.conf
        owner: root
        group: root
        mode: "0644"
    - name: Validate the complete SSH configuration without reloading
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
    - name: Require exact private handoff names and digests
      tags: [personal_platform_private_handoffs]
      when: personal_platform_dispatcher_handoffs | length > 0
      ansible.builtin.assert:
        that:
          - personal_platform_dispatcher_handoffs is mapping
          - >-
            personal_platform_dispatcher_handoffs.keys()
            | difference(personal_platform_dispatcher_handoff_paths.keys()) | length == 0
          - >-
            personal_platform_dispatcher_handoffs.values() | map(attribute='sha256')
            | select('match', '^[0-9a-f]{64}$') | list | length
            == personal_platform_dispatcher_handoffs | length
    - name: Read back the installed runtime for the governed handoff
      tags: [personal_platform_private_handoffs]
      when: "'host-gate' in personal_platform_dispatcher_handoffs"
      ansible.builtin.stat:
        path: /usr/local/lib/personal-platform/host_gate.py
        checksum_algorithm: sha256
      register: personal_platform_dispatcher_handoff_runtime
    - name: Require the runtime pinned by the governed handoff
      tags: [personal_platform_private_handoffs]
      when: "'host-gate' in personal_platform_dispatcher_handoffs"
      ansible.builtin.assert:
        that:
          - >-
            personal_platform_dispatcher_handoff_runtime.stat.checksum ==
            (lookup('ansible.builtin.file', personal_platform_dispatcher_handoffs['host-gate'].src)
            | from_json).runtime_sha256
    - name: Install the exact private handoff bytes from the controller
      tags: [personal_platform_private_handoffs]
      ansible.builtin.copy:
        src: "{{ item.value.src }}"
        dest: "{{ personal_platform_dispatcher_handoff_paths[item.key] }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ personal_platform_dispatcher_handoffs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
    - name: Read back the installed private handoff digests
      tags: [personal_platform_private_handoffs]
      ansible.builtin.stat:
        path: "{{ personal_platform_dispatcher_handoff_paths[item.key] }}"
        checksum_algorithm: sha256
      loop: "{{ personal_platform_dispatcher_handoffs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: personal_platform_dispatcher_handoff_readback
    - name: Require the exact private handoff bytes
      tags: [personal_platform_private_handoffs]
      ansible.builtin.assert:
        that:
          - item.stat.checksum == item.item.value.sha256
          - item.stat.uid == 0
          - item.stat.mode == '0600'
          - item.stat.nlink == 1
      loop: "{{ personal_platform_dispatcher_handoff_readback.results }}"
      loop_control:
        label: "{{ item.item.key }}"
