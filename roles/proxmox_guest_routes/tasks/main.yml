---
- name: Validate guest routes enable flag
  ansible.builtin.assert:
    that:
      - proxmox_guest_routes_enabled is boolean
    fail_msg: "proxmox_guest_routes_enabled must be a boolean."

- name: Stop when the guest routes role is disabled
  ansible.builtin.meta: end_role
  when: not proxmox_guest_routes_enabled | bool

- name: Validate the guest routes run contract
  ansible.builtin.assert:
    that:
      - ansible_limit is defined
      - (ansible_limit | split(',') | map('trim') | list) == [inventory_hostname]
      - ansible_run_tags | list | sort == ['proxmox_guest_routes']
      - (proxmox_guest_routes_vmid | string) is match('^[1-9][0-9]{2,8}$')
      - (proxmox_guest_routes_vmid | string) in proxmox_guest_routes_guests
      - proxmox_guest_routes_hook_path is match('^/etc/network/if-up\.d/[a-z0-9-]+$')
    fail_msg: >-
      Guest routes contract incomplete. Limit the run to exactly the node that
      hosts the guest, use --tags proxmox_guest_routes and pass
      -e proxmox_guest_routes_vmid=<declared VMID>.

- name: Select the declared guest
  ansible.builtin.set_fact:
    proxmox_guest_routes_id: "{{ proxmox_guest_routes_vmid | string }}"
    proxmox_guest_routes_spec: "{{ proxmox_guest_routes_guests[proxmox_guest_routes_vmid | string] }}"

- name: Validate the declared guest
  ansible.builtin.assert:
    that:
      - proxmox_guest_routes_spec.node == inventory_hostname
      - proxmox_guest_routes_spec.hostname is match('^[A-Za-z0-9][A-Za-z0-9-]{0,62}$')
      - proxmox_guest_routes_spec.interface is match('^[a-z][a-z0-9]{1,14}$')
      - proxmox_guest_routes_spec.routes | length >= 1
    fail_msg: "Guest {{ proxmox_guest_routes_id }} declaration is incomplete or targets another node."

- name: Validate every declared guest route
  ansible.builtin.assert:
    that:
      - item.cidr | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$')
      - item.via | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - item.cidr is not match('^0\.0\.0\.0/')
    fail_msg: "Route {{ item }} needs a non-default IPv4 cidr and a next-hop address."
    quiet: true
  loop: "{{ proxmox_guest_routes_spec.routes }}"

- name: Read the guest configuration
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ inventory_hostname }}/lxc/{{ proxmox_guest_routes_id }}/config"
      - --output-format
      - json
  register: proxmox_guest_routes_config_raw
  changed_when: false
  check_mode: false

- name: Read the guest power state
  ansible.builtin.command:
    argv: [pct, status, "{{ proxmox_guest_routes_id }}"]
  register: proxmox_guest_routes_status
  changed_when: false
  check_mode: false

- name: Refuse a guest that is not the declared running guest
  ansible.builtin.assert:
    that:
      - >-
        (proxmox_guest_routes_config_raw.stdout | from_json).hostname | default('')
        == proxmox_guest_routes_spec.hostname
      - "proxmox_guest_routes_status.stdout | trim == 'status: running'"
    fail_msg: "CT {{ proxmox_guest_routes_id }} is not the running guest {{ proxmox_guest_routes_spec.hostname }}."

- name: Confirm ifupdown2 in the guest runs if-up.d hooks
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_guest_routes_id }}"
      - "--"
      - grep
      - -qxE
      - 'addon_scripts_support\s*=\s*1'
      - /etc/network/ifupdown2/ifupdown2.conf
  changed_when: false
  check_mode: false

- name: Confirm every next hop is directly connected in the guest
  ansible.builtin.command:
    argv: [pct, exec, "{{ proxmox_guest_routes_id }}", "--", ip, -4, -o, route, get, "{{ item.via }}"]
  loop: "{{ proxmox_guest_routes_spec.routes }}"
  register: proxmox_guest_routes_nexthop
  changed_when: false
  check_mode: false
  failed_when: >-
    proxmox_guest_routes_nexthop.rc != 0
    or proxmox_guest_routes_nexthop.stdout is not search(' dev ' ~ proxmox_guest_routes_spec.interface ~ ' ')
    or proxmox_guest_routes_nexthop.stdout is search(' via ')

- name: Read the hook installed in the guest
  ansible.builtin.command:
    argv: [pct, exec, "{{ proxmox_guest_routes_id }}", "--", cat, "{{ proxmox_guest_routes_hook_path }}"]
  register: proxmox_guest_routes_hook_live
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install the route hook in the guest
  vars:
    hook: "{{ lookup('ansible.builtin.template', 'netiso-routes.sh.j2') }}"
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_guest_routes_id }}"
      - "--"
      - sh
      - -c
      - 'cat > "$1.netiso" && chmod 0755 "$1.netiso" && mv "$1.netiso" "$1"'
      - sh
      - "{{ proxmox_guest_routes_hook_path }}"
    stdin: "{{ hook | trim }}"
  changed_when: true
  when: proxmox_guest_routes_hook_live.rc != 0 or proxmox_guest_routes_hook_live.stdout | trim != hook | trim

- name: Read the live guest routes
  ansible.builtin.command:
    argv: [pct, exec, "{{ proxmox_guest_routes_id }}", "--", ip, -4, -o, route, show, "{{ item.cidr }}"]
  loop: "{{ proxmox_guest_routes_spec.routes }}"
  register: proxmox_guest_routes_live
  changed_when: false
  check_mode: false

- name: Decide which declared routes are missing or different
  ansible.builtin.set_fact:
    proxmox_guest_routes_missing: >-
      {%- set out = [] -%}
      {%- for result in proxmox_guest_routes_live.results -%}
      {%- if result.stdout is not search(' via ' ~ (result.item.via | regex_escape) ~ ' dev '
                                         ~ proxmox_guest_routes_spec.interface ~ '( |$)') -%}
      {%- set _ = out.append(result.item.cidr) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Apply the routes by running the hook as ifupdown2 would (no network reload)
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_guest_routes_id }}"
      - "--"
      - env
      - "IFACE={{ proxmox_guest_routes_spec.interface }}"
      - MODE=start
      - "{{ proxmox_guest_routes_hook_path }}"
  changed_when: true
  when: proxmox_guest_routes_missing | length > 0

- name: Confirm every route resolves through its next hop in the guest
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_guest_routes_id }}"
      - "--"
      - ip
      - -4
      - -o
      - route
      - get
      - "{{ item.cidr | regex_replace('/.*$', '') }}"
  loop: "{{ proxmox_guest_routes_spec.routes }}"
  register: proxmox_guest_routes_check
  changed_when: false
  check_mode: false
  failed_when: >-
    proxmox_guest_routes_check.stdout is not search(' via ' ~ (item.via | regex_escape)
                                                    ~ ' dev ' ~ proxmox_guest_routes_spec.interface ~ ' ')
  when: not ansible_check_mode
