---
# One managed policy of the application, matched by exact name.
- name: Select the existing policy by exact name
  ansible.builtin.set_fact:
    agent_context_tunnel_policy_current: >-
      {{ agent_context_tunnel_existing_policies
      | selectattr('name', 'equalto', agent_context_tunnel_policy.name) | list }}
  no_log: true

- name: Refuse duplicate policy names
  ansible.builtin.assert:
    that: agent_context_tunnel_policy_current | length <= 1
    fail_msg: More than one policy has a managed name; refusing an ambiguous update.

- name: Decide the policy action
  ansible.builtin.set_fact:
    agent_context_tunnel_policy_action: >-
      {{ 'create' if agent_context_tunnel_policy_current | length == 0 else
      ('update' if agent_context_tunnel_policy_current[0].decision | default('') != agent_context_tunnel_policy.decision
      or agent_context_tunnel_policy_current[0].include | default([]) != agent_context_tunnel_policy.include
      or agent_context_tunnel_policy_current[0].exclude | default([]) != agent_context_tunnel_policy.exclude
      or agent_context_tunnel_policy_current[0].require | default([]) != agent_context_tunnel_policy.require
      or agent_context_tunnel_policy_current[0].precedence | default(0) | int != agent_context_tunnel_policy.precedence
      else 'none') }}
  no_log: true

- name: Remember the pending policy change
  ansible.builtin.set_fact:
    agent_context_tunnel_policy_pending: >-
      {{ agent_context_tunnel_policy_pending + [agent_context_tunnel_policy_action ~ ' Access policy '
      ~ agent_context_tunnel_policy.name] }}
  when: agent_context_tunnel_policy_action != 'none'

- name: Create the missing policy
  ansible.builtin.include_tasks: api.yml
  vars:
    agent_context_tunnel_api_method: POST
    agent_context_tunnel_api_purpose: create Access policy
    agent_context_tunnel_api_path: >-
      /accounts/{{ agent_context_tunnel_account_id }}/access/apps/{{ agent_context_tunnel_app_id }}/policies
    agent_context_tunnel_api_body: "{{ agent_context_tunnel_policy }}"
  when:
    - agent_context_tunnel_policy_action == 'create'
    - not ansible_check_mode

- name: Update the drifted policy
  ansible.builtin.include_tasks: api.yml
  vars:
    agent_context_tunnel_api_method: PUT
    agent_context_tunnel_api_purpose: update Access policy
    agent_context_tunnel_api_path: >-
      /accounts/{{ agent_context_tunnel_account_id }}/access/apps/{{ agent_context_tunnel_app_id }}/policies/{{
      agent_context_tunnel_policy_current[0].id }}
    agent_context_tunnel_api_body: "{{ agent_context_tunnel_policy }}"
  when:
    - agent_context_tunnel_policy_action == 'update'
    - not ansible_check_mode
