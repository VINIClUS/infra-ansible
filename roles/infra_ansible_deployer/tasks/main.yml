---
- name: Validate the fixed privileged deployment contract
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_service_mgr == 'systemd'
      - infra_ansible_deployer_public_sha is match('^[0-9a-f]{40}$')
      - infra_ansible_deployer_inventory_sha is match('^[0-9a-f]{40}$')
      - ansible_architecture in ['x86_64', 'amd64']
      - infra_ansible_deployer_public_repo_dest == '/srv/infra-ansible'
      - >-
        infra_ansible_deployer_inventory_repo_dest ==
        '/srv/infra-ansible-inventory'
      - infra_ansible_deployer_script_path == '/usr/local/sbin/infra-ansible-deploy'
      - >-
        infra_ansible_deployer_esusdata_script_path ==
        '/usr/local/sbin/esusdata-deploy'
    fail_msg: >-
      The deployer requires Debian systemd and exact public and inventory SHAs
      at the fixed root-owned paths.

- name: Read only the deployment bootstrap secrets
  ansible.builtin.set_fact:
    infra_ansible_deployer_runtime_secrets:
      ANSIBLE_EDGE_SSH_PRIVATE_KEY: >-
        {{ lookup('ansible.builtin.env', 'ANSIBLE_EDGE_SSH_PRIVATE_KEY') }}
      INFRA_INVENTORY_DEPLOY_KEY: >-
        {{ lookup('ansible.builtin.env', 'INFRA_INVENTORY_DEPLOY_KEY') }}
      ANSIBLE_VAULT_PASSWORD: >-
        {{ lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD') }}
  no_log: true

- name: Validate deployment bootstrap secrets without disclosing them
  ansible.builtin.assert:
    that:
      - >-
        infra_ansible_deployer_runtime_secrets.ANSIBLE_EDGE_SSH_PRIVATE_KEY is
        match('(?s)^-----BEGIN OPENSSH PRIVATE KEY-----\n.+\n-----END OPENSSH PRIVATE KEY-----\n?$')
      - >-
        infra_ansible_deployer_runtime_secrets.INFRA_INVENTORY_DEPLOY_KEY is
        match('(?s)^-----BEGIN OPENSSH PRIVATE KEY-----\n.+\n-----END OPENSSH PRIVATE KEY-----\n?$')
      - >-
        infra_ansible_deployer_runtime_secrets.ANSIBLE_VAULT_PASSWORD |
        length > 0
      - >-
        infra_ansible_deployer_runtime_secrets.ANSIBLE_VAULT_PASSWORD is
        not search('[\r\n]')
    fail_msg: >-
      The dedicated edge and inventory deploy keys, and the ansible-vault
      password for the inventory repository, must be present and valid.
  no_log: true

- name: Validate the esusdata deploy key from the inventory vault
  ansible.builtin.assert:
    that:
      - >-
        infra_ansible_deployer_esusdata_ssh_private_key is
        match('(?s)^-----BEGIN OPENSSH PRIVATE KEY-----\n.+\n-----END OPENSSH PRIVATE KEY-----\n?$')
    fail_msg: >-
      infra_ansible_deployer_esusdata_ssh_private_key must be the dedicated
      OpenSSH private key for esusdata-lxc.
  no_log: true

- name: Install fixed deployment boundary dependencies
  ansible.builtin.apt:
    name: "{{ infra_ansible_deployer_packages }}"
    state: present
    update_cache: true

- name: Create root-owned deployment directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /srv
      mode: "0755"
    - path: "{{ infra_ansible_deployer_config_dir }}"
      mode: "0700"
    - path: "{{ infra_ansible_deployer_state_dir }}"
      mode: "0700"
    - path: "{{ infra_ansible_deployer_esusdata_state_dir }}"
      mode: "0700"
    - path: /run/infra-ansible
      mode: "0700"
    - path: "{{ infra_ansible_deployer_cache_dir }}"
      mode: "0700"
    - path: "{{ infra_ansible_deployer_powershell_release_dir }}"
      mode: "0755"

- name: Download pinned PowerShell archive
  ansible.builtin.get_url:
    url: "{{ infra_ansible_deployer_powershell_archive_url }}"
    dest: >-
      {{ infra_ansible_deployer_cache_dir }}/powershell-{{
      infra_ansible_deployer_powershell_version }}.tar.gz
    owner: root
    group: root
    mode: "0600"
    checksum: sha256:{{ infra_ansible_deployer_powershell_sha256 }}

- name: Extract verified PowerShell archive
  ansible.builtin.unarchive:
    src: >-
      {{ infra_ansible_deployer_cache_dir }}/powershell-{{
      infra_ansible_deployer_powershell_version }}.tar.gz
    dest: "{{ infra_ansible_deployer_powershell_release_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ infra_ansible_deployer_powershell_release_dir }}/pwsh"

- name: Make the pinned PowerShell executable
  ansible.builtin.file:
    path: "{{ infra_ansible_deployer_powershell_release_dir }}/pwsh"
    owner: root
    group: root
    mode: "0755"

- name: Activate the pinned PowerShell release
  ansible.builtin.file:
    src: "{{ infra_ansible_deployer_powershell_release_dir }}/pwsh"
    dest: /usr/local/bin/pwsh
    state: link
    owner: root
    group: root

- name: Install the private inventory deploy key
  ansible.builtin.copy:
    content: "{{ infra_ansible_deployer_runtime_secrets.INFRA_INVENTORY_DEPLOY_KEY }}\n"
    dest: "{{ infra_ansible_deployer_inventory_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the dedicated edge SSH private key
  ansible.builtin.copy:
    content: "{{ infra_ansible_deployer_runtime_secrets.ANSIBLE_EDGE_SSH_PRIVATE_KEY }}\n"
    dest: "{{ infra_ansible_deployer_edge_ssh_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the dedicated esusdata SSH private key
  ansible.builtin.copy:
    content: "{{ infra_ansible_deployer_esusdata_ssh_private_key | trim }}\n"
    dest: "{{ infra_ansible_deployer_esusdata_ssh_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the ansible-vault password for the inventory repository
  ansible.builtin.copy:
    content: "{{ infra_ansible_deployer_runtime_secrets.ANSIBLE_VAULT_PASSWORD }}"
    dest: "{{ infra_ansible_deployer_vault_password_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Remove the retired pre-vault bootstrap credential file
  ansible.builtin.file:
    path: /etc/infra-ansible-deploy.env
    state: absent

- name: Check out the exact public deployment repository SHA
  ansible.builtin.git:
    repo: "{{ infra_ansible_deployer_public_repo_url }}"
    dest: "{{ infra_ansible_deployer_public_repo_dest }}"
    version: "{{ infra_ansible_deployer_public_sha }}"
    force: false
    update: true
  environment:
    GIT_TERMINAL_PROMPT: "0"

- name: Check out the exact private inventory repository SHA
  ansible.builtin.git:
    repo: "{{ infra_ansible_deployer_inventory_repo_url }}"
    dest: "{{ infra_ansible_deployer_inventory_repo_dest }}"
    version: "{{ infra_ansible_deployer_inventory_sha }}"
    key_file: "{{ infra_ansible_deployer_inventory_key_path }}"
    accept_newhostkey: true
    force: false
    update: true
  environment:
    GIT_TERMINAL_PROMPT: "0"
  no_log: true

- name: Keep both deployment repositories root-owned
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    recurse: true
  loop:
    - "{{ infra_ansible_deployer_public_repo_dest }}"
    - "{{ infra_ansible_deployer_inventory_repo_dest }}"

- name: Install the root-owned deployment boundary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tools/deploy/infra_ansible_deploy.py"
    dest: /usr/local/sbin/infra-ansible-deploy
    owner: root
    group: root
    mode: "0755"

- name: Install the root-owned esusdata release boundary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tools/deploy/esusdata_deploy.py"
    dest: "{{ infra_ansible_deployer_esusdata_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the only privileged runner commands
  ansible.builtin.template:
    src: infra-ansible-deploy.sudoers.j2
    dest: /etc/sudoers.d/infra-ansible-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
