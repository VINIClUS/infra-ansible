---
# Expects agent_context_luks_volume. The container file did not exist when the
# play started, so anything created here belongs to this run.
- name: Forget state of any previous volume
  ansible.builtin.set_fact:
    agent_context_luks_created_inode: 0
    agent_context_luks_opened: false

- name: Format one volume, removing only its own new artifacts on failure
  block:
    # noclobber makes the shell create the file with O_EXCL, so an existing
    # file fails here instead of being reused. The path is an argument, never
    # part of the script.
    - name: Create the container file exclusively
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'umask 077 && set -C && : > "$1"'
          - sh
          - "{{ agent_context_luks_volume.container }}"
      changed_when: true

    - name: Inspect the file created by this run
      ansible.builtin.stat:
        path: "{{ agent_context_luks_volume.container }}"
        follow: false
      register: agent_context_luks_new_file

    - name: Remember the inode created by this run
      ansible.builtin.set_fact:
        agent_context_luks_created_inode: "{{ agent_context_luks_new_file.stat.inode }}"

    - name: Allocate the container file without holes
      ansible.builtin.command:
        argv: [fallocate, -l, "{{ agent_context_luks_volume.size }}", "{{ agent_context_luks_volume.container }}"]
      changed_when: true

    - name: Restrict the container file to root
      ansible.builtin.file:
        path: "{{ agent_context_luks_volume.container }}"
        owner: "{{ agent_context_luks_owner }}"
        group: "{{ agent_context_luks_group }}"
        mode: "0600"

    - name: Refuse a container that already carries a LUKS header
      ansible.builtin.command:
        argv: [cryptsetup, isLuks, "{{ agent_context_luks_volume.container }}"]
      register: agent_context_luks_header
      changed_when: false
      failed_when: agent_context_luks_header.rc == 0

    - name: Inspect the file again immediately before formatting
      ansible.builtin.stat:
        path: "{{ agent_context_luks_volume.container }}"
        follow: false
      register: agent_context_luks_pre_format

    - name: Require the very file this run created
      ansible.builtin.assert:
        that:
          - agent_context_luks_pre_format.stat.exists
          - agent_context_luks_pre_format.stat.isreg
          - not agent_context_luks_pre_format.stat.islnk
          - agent_context_luks_pre_format.stat.inode == agent_context_luks_created_inode | int
        fail_msg: The container file is not the one created by this run; refusing to format it.

    - name: Format the LUKS2 container
      ansible.builtin.command:
        argv:
          - cryptsetup
          - luksFormat
          - --type
          - luks2
          - --pbkdf
          - argon2id
          - --pbkdf-memory
          - "{{ agent_context_luks_pbkdf_memory }}"
          - --batch-mode
          - --key-file=-
          - "{{ agent_context_luks_volume.container }}"
        stdin: >-
          {{ agent_context_luks_data_key if agent_context_luks_volume.name == 'data'
          else agent_context_luks_backup_key }}
        stdin_add_newline: false
      changed_when: true
      no_log: true

    - name: Open the new container
      ansible.builtin.command:
        argv:
          - cryptsetup
          - open
          - --type
          - luks2
          - --key-file=-
          - "{{ agent_context_luks_volume.container }}"
          - "{{ agent_context_luks_volume.mapper }}"
        stdin: >-
          {{ agent_context_luks_data_key if agent_context_luks_volume.name == 'data'
          else agent_context_luks_backup_key }}
        stdin_add_newline: false
      changed_when: true
      no_log: true

    - name: Note that the mapping was opened by this run
      ansible.builtin.set_fact:
        agent_context_luks_opened: true

    - name: Create the ext4 filesystem with its label
      ansible.builtin.command:
        argv:
          - mkfs.ext4
          - -q
          - -L
          - "{{ agent_context_luks_volume.label }}"
          - "/dev/mapper/{{ agent_context_luks_volume.mapper }}"
      changed_when: true

    - name: Close the freshly formatted volume
      ansible.builtin.command:
        argv: [cryptsetup, close, "{{ agent_context_luks_volume.mapper }}"]
      changed_when: true
  rescue:
    - name: Close the mapping opened by this run
      ansible.builtin.command:
        argv: [cryptsetup, close, "{{ agent_context_luks_volume.mapper }}"]
      changed_when: true
      failed_when: false
      when: agent_context_luks_opened | bool

    - name: Inspect the container file left behind
      ansible.builtin.stat:
        path: "{{ agent_context_luks_volume.container }}"
        follow: false
      register: agent_context_luks_leftover

    - name: Remove the container file only if this run created it
      ansible.builtin.file:
        path: "{{ agent_context_luks_volume.container }}"
        state: absent
      when:
        - agent_context_luks_created_inode | int > 0
        - agent_context_luks_leftover.stat.exists
        - agent_context_luks_leftover.stat.inode == agent_context_luks_created_inode | int

    - name: Fail the provisioning run
      ansible.builtin.fail:
        msg: >-
          Provisioning volume {{ agent_context_luks_volume.name }} failed; a container file created by this
          run was removed, anything else was left untouched.
