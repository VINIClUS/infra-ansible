---
# Expects agent_context_luks_volume. Identification fails on any foreign mapping
# or mount, so nothing that is not ours is ever unmounted or closed.
- name: Identify what exists for the volume
  ansible.builtin.include_tasks: identify_volume.yml

- name: Unmount the volume
  ansible.builtin.command:
    argv: [umount, "{{ agent_context_luks_volume.mountpoint }}"]
  changed_when: true
  when: agent_context_luks_identity.mounted | bool

- name: Close the LUKS volume
  ansible.builtin.command:
    argv: [cryptsetup, close, "{{ agent_context_luks_volume.mapper }}"]
  changed_when: true
  when: agent_context_luks_identity.mapper_active | bool
