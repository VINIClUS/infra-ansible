---
proxmox_lxc_guest_enabled: false
proxmox_lxc_guest_api_host: "{{ pve_host | default('') }}"
proxmox_lxc_guest_api_port: 443
proxmox_lxc_guest_api_user: "{{ (pve_token_id | default('')).split('!')[0] }}"
proxmox_lxc_guest_api_token_id: "{{ (pve_token_id | default('')).split('!')[-1] }}"
proxmox_lxc_guest_api_token_secret: "{{ pve_token_secret | default('') }}"
proxmox_lxc_guest_validate_certs: true
proxmox_lxc_guest_node: pve-01
proxmox_lxc_guest_template_vmid: 9400
proxmox_lxc_guest_template_name: tlp-ct-debian-13
proxmox_lxc_guest_vmid: 0
proxmox_lxc_guest_hostname: ansible
proxmox_lxc_guest_storage: local-lvm
proxmox_lxc_guest_bridge: vmbr0
proxmox_lxc_guest_cmode: tty
proxmox_lxc_guest_cores: 2
proxmox_lxc_guest_memory_mb: 4096
proxmox_lxc_guest_disk_gb: 32
proxmox_lxc_guest_onboot: true
# Optional pinned NIC MAC (upper-case, colon separated) for a DHCP reservation;
# empty keeps the MAC Proxmox generates for the clone.
proxmox_lxc_guest_mac_address: ""
