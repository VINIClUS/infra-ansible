---
- name: Prepare isolated temporary credentials without importing secret values
  when: personal_platform_credentials_enabled | bool
  block:
    - name: Require the same physical dispatcher and lease boundary
      ansible.builtin.assert:
        that:
          - personal_platform_dispatcher_enabled | bool
          - ansible_limit | default('') == inventory_hostname
    - name: Create root-only temporary credential directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /run/personal-platform/credentials
        - /run/personal-platform/credentials/cnesdata
        - /run/personal-platform/probes
    - name: Create the container-group credential_process directory
      ansible.builtin.file:
        path: /run/personal-platform/credentials/cnesdata/current
        state: directory
        owner: root
        group: "10001"
        mode: "0710"
    - name: Recreate the tmpfs credential directories on every boot
      ansible.builtin.copy:
        content: |
          d /run/personal-platform 0700 root root -
          d /run/personal-platform/credentials 0700 root root -
          d /run/personal-platform/credentials/cnesdata 0700 root root -
          d /run/personal-platform/credentials/cnesdata/current 0710 root 10001 -
        dest: /etc/tmpfiles.d/personal-platform-credentials.conf
        owner: root
        group: root
        mode: "0644"
    - name: Install the fixed root-only credential renewer without starting it
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Personal platform lease-bound temporary credential publication
          After=docker.service
          Requires=docker.service
          [Service]
          Type=oneshot
          User=root
          Group=root
          UMask=0077
          ExecStart=/usr/bin/python3 -I /usr/local/lib/personal-platform/host_gate.py --credential-reload
          TimeoutStartSec=180
          TimeoutStopSec=15
          KillMode=control-group
          PrivateTmp=yes
          NoNewPrivileges=yes
          ProtectHome=yes
          ProtectSystem=strict
          ReadWritePaths=/run/personal-platform /var/lib/personal-platform/deployments
        dest: /etc/systemd/system/personal-platform-credential-reload.service
        owner: root
        group: root
        mode: "0644"
    - name: Install the 300-second renewal timer without enabling it
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Personal platform credential_process publication and adoption
          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=300s
          AccuracySec=10s
          Unit=personal-platform-credential-reload.service
          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/personal-platform-credential-reload.timer
        owner: root
        group: root
        mode: "0644"
