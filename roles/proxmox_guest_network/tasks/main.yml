---
- name: Validate guest network enable flag
  ansible.builtin.assert:
    that:
      - proxmox_guest_network_enabled is boolean
    fail_msg: "proxmox_guest_network_enabled must be a boolean."

- name: Stop when the guest network role is disabled
  ansible.builtin.meta: end_role
  when: not proxmox_guest_network_enabled | bool

- name: Validate the guest network run contract
  ansible.builtin.assert:
    that:
      - ansible_limit is defined
      - (ansible_limit | split(',') | map('trim') | list) == [inventory_hostname]
      - ansible_run_tags | list | sort == ['proxmox_guest_network']
      - proxmox_guest_network_rollback is boolean
      - (proxmox_guest_network_vmid | string) is match('^[1-9][0-9]{2,8}$')
      - (proxmox_guest_network_vmid | string) in proxmox_guest_network_guests
      - proxmox_guest_network_mtu | int >= 1280
      - proxmox_guest_network_mtu | int <= 1500
      - proxmox_guest_network_router_host in hostvars
    fail_msg: >-
      Guest network contract incomplete. Limit the run to exactly the node that
      hosts the guest (--limit <node>), use --tags proxmox_guest_network, pass
      -e proxmox_guest_network_vmid=<declared VMID> (rollback with
      -e '{"proxmox_guest_network_rollback": true}') and set the router host.

- name: Select the declared guest
  ansible.builtin.set_fact:
    proxmox_guest_network_id: "{{ proxmox_guest_network_vmid | string }}"
    proxmox_guest_network_spec: "{{ proxmox_guest_network_guests[proxmox_guest_network_vmid | string] }}"
    proxmox_guest_network_ts: "{{ now(fmt='%Y%m%d-%H%M%S') }}"

- name: Validate the declared guest
  vars:
    ip_re: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    cidr_re: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'
  ansible.builtin.assert:
    that:
      - proxmox_guest_network_spec.node == inventory_hostname
      - proxmox_guest_network_spec.hostname is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - proxmox_guest_network_spec.from.bridge is match('^[a-z][a-z0-9]{1,14}$')
      - proxmox_guest_network_spec.from.ip == 'dhcp' or proxmox_guest_network_spec.from.ip is match(cidr_re)
      - proxmox_guest_network_spec.from.ip in ['dhcp', proxmox_guest_network_spec.from.address]
      - proxmox_guest_network_spec.from.address is match(cidr_re)
      - proxmox_guest_network_spec.from.gw is match(ip_re)
      - proxmox_guest_network_spec.from.mtu | int >= 1280
      - proxmox_guest_network_spec.from.mtu | int <= 1500
      - proxmox_guest_network_spec.to.bridge is match('^[a-z][a-z0-9]{1,7}$')
      - proxmox_guest_network_spec.to.bridge != proxmox_guest_network_spec.from.bridge
      - proxmox_guest_network_spec.to.ip is match(cidr_re)
      - proxmox_guest_network_spec.to.gw is match(ip_re)
      - proxmox_guest_network_spec.to.nameserver is match(ip_re)
      - proxmox_guest_network_spec.to.searchdomain is match('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')
      - proxmox_guest_network_spec.busy_pattern | default('') is string
      - proxmox_guest_network_spec.services | default([]) is sequence
      - proxmox_guest_network_spec.services | default([]) is not string
      - >-
        proxmox_guest_network_spec.services | default([])
        | reject('match', '^[A-Za-z0-9@._-]+\.service$') | list | length == 0
      - proxmox_guest_network_spec.https_probe is match('^https://[^\s"]+$')
    fail_msg: "Guest {{ proxmox_guest_network_id }} declaration is incomplete or targets another node."

- name: Read the guest configuration
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ inventory_hostname }}/lxc/{{ proxmox_guest_network_id }}/config"
      - --output-format
      - json
  register: proxmox_guest_network_config_raw
  changed_when: false
  check_mode: false

- name: Read the pending guest changes
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ inventory_hostname }}/lxc/{{ proxmox_guest_network_id }}/pending"
      - --output-format
      - json
  register: proxmox_guest_network_pending_raw
  changed_when: false
  check_mode: false

- name: Read the guest power state
  ansible.builtin.command:
    argv: [pct, status, "{{ proxmox_guest_network_id }}"]
  register: proxmox_guest_network_status_raw
  changed_when: false
  check_mode: false

- name: Read the HA resources
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/ha/resources, --output-format, json]
  register: proxmox_guest_network_ha_raw
  changed_when: false
  check_mode: false

- name: Parse the live guest state
  ansible.builtin.set_fact:
    proxmox_guest_network_config: "{{ proxmox_guest_network_config_raw.stdout | from_json }}"
    proxmox_guest_network_pending: >-
      {{ proxmox_guest_network_pending_raw.stdout | from_json
         | selectattr('pending', 'defined') | list
         + (proxmox_guest_network_pending_raw.stdout | from_json | selectattr('delete', 'defined') | list) }}
    proxmox_guest_network_ha: >-
      {{ proxmox_guest_network_ha_raw.stdout | from_json
         | selectattr('sid', 'equalto', 'ct:' ~ proxmox_guest_network_id) | list }}
    proxmox_guest_network_running: "{{ proxmox_guest_network_status_raw.stdout | trim == 'status: running' }}"

- name: Parse net0
  ansible.builtin.set_fact:
    proxmox_guest_network_net0: >-
      {{ dict(proxmox_guest_network_config.net0 | default('') | split(',')
              | select('search', '=') | map('split', '=')) }}

- name: Validate the live guest
  ansible.builtin.assert:
    that:
      - proxmox_guest_network_config.hostname | default('') == proxmox_guest_network_spec.hostname
      - proxmox_guest_network_config.ostype | default('') in ['debian', 'ubuntu']
      - proxmox_guest_network_config | list | select('match', '^net[1-9][0-9]*$') | list | length == 0
      - proxmox_guest_network_net0.name | default('') == 'eth0'
      - proxmox_guest_network_net0.type | default('veth') == 'veth'
      - proxmox_guest_network_net0.hwaddr | default('') is match('^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$')
      - proxmox_guest_network_net0.firewall | default('0') == '1'
      - proxmox_guest_network_net0.ip6 is not defined
      - proxmox_guest_network_pending | length == 0
      - proxmox_guest_network_running | bool
      - proxmox_guest_network_ha | length == 0 or proxmox_guest_network_ha[0].state == 'started'
    fail_msg: >-
      CT {{ proxmox_guest_network_id }} is not a running single-NIC veth guest named
      {{ proxmox_guest_network_spec.hostname }} with firewall=1, a fixed MAC, no IPv6,
      no pending changes and HA (if any) in state started.

- name: Decide what this run does
  vars:
    net0: "{{ proxmox_guest_network_net0 }}"
    spec: "{{ proxmox_guest_network_spec }}"
    at_from: "{{ net0.bridge | default('') == spec.from.bridge and net0.ip | default('') == spec.from.ip }}"
    at_to: >-
      {{ net0.bridge | default('') == spec.to.bridge and net0.ip | default('') == spec.to.ip
         and net0.gw | default('') == spec.to.gw
         and net0.mtu | default('') | string == proxmox_guest_network_mtu | string }}
  ansible.builtin.set_fact:
    proxmox_guest_network_action: >-
      {{ ('rollback' if at_to | bool else ('verify_from' if at_from | bool else 'unknown'))
         if proxmox_guest_network_rollback
         else ('migrate' if at_from | bool else ('verify_to' if at_to | bool else 'unknown')) }}

- name: Refuse a guest that is neither at its source nor at its target
  ansible.builtin.assert:
    that:
      - proxmox_guest_network_action != 'unknown'
    fail_msg: >-
      CT {{ proxmox_guest_network_id }} net0 matches neither the declared source
      ({{ proxmox_guest_network_spec.from.bridge }}) nor the target
      ({{ proxmox_guest_network_spec.to.bridge }}); review it by hand.

- name: Look for the original network record
  ansible.builtin.stat:
    path: "{{ proxmox_guest_network_backup_root }}/{{ proxmox_guest_network_id }}-original.json"
  register: proxmox_guest_network_original_stat

- name: Read the original network record
  ansible.builtin.slurp:
    src: "{{ proxmox_guest_network_backup_root }}/{{ proxmox_guest_network_id }}-original.json"
  register: proxmox_guest_network_original_raw
  when: proxmox_guest_network_original_stat.stat.exists

- name: Parse the original network record
  ansible.builtin.set_fact:
    proxmox_guest_network_original: >-
      {{ (proxmox_guest_network_original_raw.content | b64decode | from_json)
         if proxmox_guest_network_original_stat.stat.exists else {} }}

- name: Check the original record matches the live source before a move
  ansible.builtin.assert:
    that:
      - proxmox_guest_network_original.net0 == proxmox_guest_network_config.net0
    fail_msg: >-
      {{ proxmox_guest_network_backup_root }}/{{ proxmox_guest_network_id }}-original.json
      differs from the live net0; reconcile it before moving the guest again.
  when:
    - proxmox_guest_network_action == 'migrate'
    - proxmox_guest_network_original_stat.stat.exists

- name: Check the original record can drive the rollback
  vars:
    original_net0: >-
      {{ dict(proxmox_guest_network_original.net0 | default('') | split(',')
              | select('search', '=') | map('split', '=')) }}
  ansible.builtin.assert:
    that:
      - proxmox_guest_network_original_stat.stat.exists
      - original_net0.bridge | default('') == proxmox_guest_network_spec.from.bridge
      - original_net0.ip | default('') == proxmox_guest_network_spec.from.ip
      - original_net0.hwaddr | default('') == proxmox_guest_network_net0.hwaddr
    fail_msg: >-
      No usable original network record for CT {{ proxmox_guest_network_id }};
      it must exist, match the declared source and keep the same MAC.
  when: proxmox_guest_network_action == 'rollback'

- name: Build the settings this run applies
  vars:
    spec: "{{ proxmox_guest_network_spec }}"
    moved: >-
      {{ proxmox_guest_network_net0 | combine({'bridge': spec.to.bridge, 'ip': spec.to.ip,
         'gw': spec.to.gw, 'mtu': proxmox_guest_network_mtu | string}) }}
  ansible.builtin.set_fact:
    proxmox_guest_network_before:
      net0: "{{ proxmox_guest_network_config.net0 }}"
      nameserver: "{{ proxmox_guest_network_config.nameserver | default(none) }}"
      searchdomain: "{{ proxmox_guest_network_config.searchdomain | default(none) }}"
    proxmox_guest_network_desired: >-
      {{ {'net0': moved | dict2items | map(attribute='key') | zip(moved | dict2items | map(attribute='value'))
                  | map('join', '=') | join(','),
          'nameserver': spec.to.nameserver, 'searchdomain': spec.to.searchdomain}
         if proxmox_guest_network_action == 'migrate'
         else {'net0': proxmox_guest_network_original.net0 | default(''),
               'nameserver': proxmox_guest_network_original.nameserver | default(none),
               'searchdomain': proxmox_guest_network_original.searchdomain | default(none)} }}
    proxmox_guest_network_expect_from:
      cidr: "{{ proxmox_guest_network_spec.from.address }}"
      gw: "{{ proxmox_guest_network_spec.from.gw }}"
      mtu: "{{ proxmox_guest_network_spec.from.mtu }}"
      nameserver: "-"
    proxmox_guest_network_expect_to:
      cidr: "{{ proxmox_guest_network_spec.to.ip }}"
      gw: "{{ proxmox_guest_network_spec.to.gw }}"
      mtu: "{{ proxmox_guest_network_mtu }}"
      nameserver: "{{ proxmox_guest_network_spec.to.nameserver }}"

- name: Check the guest has the tools the probe needs
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_guest_network_id }}"
      - "--"
      - sh
      - -c
      - >-
        for t in ip ping getent awk grep systemctl; do command -v "$t" >/dev/null || exit 3; done;
        command -v curl >/dev/null || command -v wget >/dev/null || exit 4;
        ! ls /etc/network/.pve-ignore.* /etc/.pve-ignore.* >/dev/null 2>&1 || exit 5
  changed_when: false
  check_mode: false

- name: Refuse to restart a busy guest
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_guest_network_id }}"
      - "--"
      - pgrep
      - -f
      - "{{ proxmox_guest_network_spec.busy_pattern }}"
  register: proxmox_guest_network_busy
  changed_when: false
  check_mode: false
  failed_when: proxmox_guest_network_busy.rc not in [1]
  when:
    - proxmox_guest_network_action in ['migrate', 'rollback']
    - proxmox_guest_network_spec.busy_pattern | default('') | length > 0

- name: Find other guests that declare the target address
  ansible.builtin.command:
    argv:
      - find
      - /etc/pve/nodes
      - -name
      - "*.conf"
      - (
      - -path
      - "*/lxc/*"
      - -o
      - -path
      - "*/qemu-server/*"
      - )
      - -exec
      - grep
      - -lE
      - "(^|[ ,])ip={{ proxmox_guest_network_spec.to.ip.split('/')[0] | regex_escape }}/"
      - "{}"
      - +
  register: proxmox_guest_network_claims
  changed_when: false
  check_mode: false
  failed_when: proxmox_guest_network_claims.rc not in [0, 1]
  when: proxmox_guest_network_action == 'migrate'

- name: Refuse a target address another guest declares
  ansible.builtin.assert:
    that:
      - >-
        proxmox_guest_network_claims.stdout_lines
        | reject('search', '/lxc/' ~ proxmox_guest_network_id ~ '\.conf$') | list | length == 0
    fail_msg: "Another guest already declares the target address of CT {{ proxmox_guest_network_id }}."
  when: proxmox_guest_network_action == 'migrate'

- name: ARP-probe the target address from the zone router
  ansible.builtin.command:
    argv:
      - sh
      - -c
      # Flush first: a STALE entry left by an earlier holder still shows a
      # lladdr for a while; after the flush only a live answer fills it in.
      - 'ip -4 neigh flush to "$1"; ping -c 2 -W 1 "$1" >/dev/null 2>&1; ip -4 neigh show to "$1"'
      - sh
      - "{{ proxmox_guest_network_spec.to.ip.split('/')[0] }}"
  delegate_to: "{{ proxmox_guest_network_router_host }}"
  become: true
  register: proxmox_guest_network_arp
  changed_when: false
  check_mode: false
  failed_when: >-
    proxmox_guest_network_arp.rc != 0
    or proxmox_guest_network_arp.stdout is search('lladdr')
  when: proxmox_guest_network_action == 'migrate'

- name: Report the planned change
  ansible.builtin.debug:
    msg: >-
      CT {{ proxmox_guest_network_id }} ({{ proxmox_guest_network_spec.hostname }}):
      {{ proxmox_guest_network_action }}{{ ' (check mode, nothing changes)' if ansible_check_mode else '' }};
      HA managed: {{ proxmox_guest_network_ha | length > 0 }};
      net0 {{ proxmox_guest_network_before.net0 }} ->
      {{ proxmox_guest_network_desired.net0 if proxmox_guest_network_action in ['migrate', 'rollback']
         else 'unchanged' }}

- name: Move the guest network
  ansible.builtin.include_tasks: change.yml
  when:
    - proxmox_guest_network_action in ['migrate', 'rollback']
    - not ansible_check_mode

- name: Verify the guest where it already is
  ansible.builtin.include_tasks: verify.yml
  vars:
    proxmox_guest_network_expect: >-
      {{ proxmox_guest_network_expect_to if proxmox_guest_network_action == 'verify_to'
         else proxmox_guest_network_expect_from }}
  when: proxmox_guest_network_action in ['verify_to', 'verify_from']
