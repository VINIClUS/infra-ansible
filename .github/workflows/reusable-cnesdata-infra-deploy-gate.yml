---
name: CnesData infrastructure deploy gate

"on":
  workflow_call:
    inputs:
      request_descriptor:
        required: true
        type: string
      request_descriptor_sha256:
        required: true
        type: string
      contract_repository:
        required: true
        type: string
      contract_source_sha:
        required: true
        type: string
      contract_path:
        required: true
        type: string
      contract_sha256:
        required: true
        type: string
      expected_source_sha:
        required: true
        type: string
      purpose:
        required: true
        type: string
    outputs:
      evidence_run_id:
        value: ${{ jobs.execute.outputs.evidence_run_id }}
      evidence_artifact_id:
        value: ${{ jobs.execute.outputs.evidence_artifact_id }}
      evidence_artifact_digest:
        value: ${{ jobs.execute.outputs.evidence_artifact_digest }}
      evidence_status:
        value: ${{ jobs.execute.outputs.evidence_status }}

permissions: {}

env:
  REQUEST_DESCRIPTOR: ${{ inputs.request_descriptor }}
  REQUEST_DESCRIPTOR_SHA256: ${{ inputs.request_descriptor_sha256 }}
  CONTRACT_REPOSITORY: ${{ inputs.contract_repository }}
  CONTRACT_SOURCE_SHA: ${{ inputs.contract_source_sha }}
  CONTRACT_PATH: ${{ inputs.contract_path }}
  CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  PURPOSE: ${{ inputs.purpose }}
  DELIVERY_ROLE: deploy
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    env:
      CNESDATA_DELIVERY_GOVERNANCE: ${{ secrets.CNESDATA_DELIVERY_GOVERNANCE }}
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Load actual immutable producer from authenticated run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBOOT'
          import base64, json, os, re, urllib.request
          from pathlib import Path
          role = os.environ["DELIVERY_ROLE"]
          repo = "VINIClUS/CnesData"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/develop"
          assert re.fullmatch("[0-9a-f]{40}", os.environ["EXPECTED_SOURCE_SHA"])
          def get(path):
              request = urllib.request.Request("https://api.github.com/repos/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read(2097152))
          run = get(repo + "/actions/runs/" + os.environ["GITHUB_RUN_ID"])
          assert run["head_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert run["run_attempt"] == int(os.environ["GITHUB_RUN_ATTEMPT"])
          assert run["repository"]["full_name"] == repo
          assert run["event"] == "workflow_dispatch"
          name = "infra-plan.yml" if role == "plan" else "infra-apply.yml"
          assert run["path"].split("@")[0] == ".github/workflows/" + name
          path = "VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-infra-" + role + "-gate.yml"
          refs = [r for r in run.get("referenced_workflows", []) if r["path"].startswith(path + "@")]
          assert len(refs) == 1
          pin = refs[0]["sha"]
          assert re.fullmatch("[0-9a-f]{40}", pin) and refs[0]["path"] == path + "@" + pin
          files = ["contract.py", "provenance.py", "coordination_lease.py", "aws_boundary.py",
                   "runtime.py", "outputs.py", "session_policy.py", "iam_expression.py",
                   "iam_source.py", "iam_boundary.py", "session_owner.py", "session_grouping.py",
                   "plan_gate.py", "apply_gate.py", "runtime-requirements.txt"]
          root = Path("tools/cnesdata_delivery")
          root.mkdir(parents=True, exist_ok=True)
          for name in files:
              item = get("VINIClUS/infra-ansible/contents/tools/cnesdata_delivery/" + name + "?ref=" + pin)
              assert item["type"] == "file" and item["size"] <= 262144
              (root / name).write_bytes(base64.b64decode(item["content"]))
          PYBOOT
      - name: Verify complete public source and admission proof
        run: python3 -m tools.cnesdata_delivery.apply_gate preflight
  execute:
    runs-on: ubuntu-latest
    environment: production
    env:
      CNESDATA_DELIVERY_GOVERNANCE: ${{ secrets.CNESDATA_DELIVERY_GOVERNANCE }}
    timeout-minutes: 55
    needs: validate
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    outputs:
      evidence_run_id: ${{ steps.gate.outputs.evidence_run_id }}
      evidence_artifact_id: ${{ steps.gate.outputs.evidence_artifact_id }}
      evidence_artifact_digest: ${{ steps.gate.outputs.evidence_artifact_digest }}
      evidence_status: ${{ steps.gate.outputs.evidence_status }}
    steps:
      - name: Load actual immutable producer from authenticated run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBOOT'
          import base64, json, os, re, urllib.request
          from pathlib import Path
          role = os.environ["DELIVERY_ROLE"]
          repo = "VINIClUS/CnesData"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/develop"
          assert re.fullmatch("[0-9a-f]{40}", os.environ["EXPECTED_SOURCE_SHA"])
          def get(path):
              request = urllib.request.Request("https://api.github.com/repos/" + path,
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read(2097152))
          run = get(repo + "/actions/runs/" + os.environ["GITHUB_RUN_ID"])
          assert run["head_sha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert run["run_attempt"] == int(os.environ["GITHUB_RUN_ATTEMPT"])
          assert run["repository"]["full_name"] == repo
          assert run["event"] == "workflow_dispatch"
          name = "infra-plan.yml" if role == "plan" else "infra-apply.yml"
          assert run["path"].split("@")[0] == ".github/workflows/" + name
          path = "VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-infra-" + role + "-gate.yml"
          refs = [r for r in run.get("referenced_workflows", []) if r["path"].startswith(path + "@")]
          assert len(refs) == 1
          pin = refs[0]["sha"]
          assert re.fullmatch("[0-9a-f]{40}", pin) and refs[0]["path"] == path + "@" + pin
          files = ["contract.py", "provenance.py", "coordination_lease.py", "aws_boundary.py",
                   "runtime.py", "outputs.py", "session_policy.py", "iam_expression.py",
                   "iam_source.py", "iam_boundary.py", "session_owner.py", "session_grouping.py",
                   "plan_gate.py", "apply_gate.py", "runtime-requirements.txt"]
          root = Path("tools/cnesdata_delivery")
          root.mkdir(parents=True, exist_ok=True)
          for name in files:
              item = get("VINIClUS/infra-ansible/contents/tools/cnesdata_delivery/" + name + "?ref=" + pin)
              assert item["type"] == "file" and item["size"] <= 262144
              (root / name).write_bytes(base64.b64decode(item["content"]))
          PYBOOT
      - name: Verify complete public source and admission proof
        run: python3 -m tools.cnesdata_delivery.apply_gate preflight
      - name: Check out authenticated exact product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: VINIClUS/CnesData
          ref: ${{ inputs.expected_source_sha }}
          path: product
          persist-credentials: false
      - name: Check out pinned artifact SDK bundle
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: actions/upload-artifact
          ref: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
          path: .delivery-uploader
          persist-credentials: false
      - name: Set pinned Node runtime for the artifact SDK
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.11.1"
          package-manager-cache: false
      - name: Install checksum-locked protected runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/delivery-bin"
          release="https://github.com/opentofu/opentofu/releases/download/v1.13.2"
          curl -fsSL --max-time 120 -o "${RUNNER_TEMP}/tofu.zip" "${release}/tofu_1.13.2_linux_amd64.zip"
          echo "723bebb0df8411daff1e5fc3862e28ff5581fe5634087f4c29a9aa41d78208b5  ${RUNNER_TEMP}/tofu.zip" \
            | sha256sum -c -
          unzip -p "${RUNNER_TEMP}/tofu.zip" tofu > "${RUNNER_TEMP}/delivery-bin/tofu"
          chmod 755 "${RUNNER_TEMP}/delivery-bin/tofu"
          release="https://github.com/open-policy-agent/conftest/releases/download/v0.71.1"
          curl -fsSL --max-time 120 -o "${RUNNER_TEMP}/conftest.tar.gz" \
            "${release}/conftest_0.71.1_Linux_x86_64.tar.gz"
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  ${RUNNER_TEMP}/conftest.tar.gz" \
            | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/conftest.tar.gz" -C "${RUNNER_TEMP}/delivery-bin" conftest
          echo "${RUNNER_TEMP}/delivery-bin" >> "${GITHUB_PATH}"
          python3 -m venv "${RUNNER_TEMP}/delivery-python"
          "${RUNNER_TEMP}/delivery-python/bin/pip" install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r tools/cnesdata_delivery/runtime-requirements.txt
          echo "${RUNNER_TEMP}/delivery-python/bin" >> "${GITHUB_PATH}"
      - name: Bridge masked artifact runtime from Node action handler
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ["ACTIONS_RUNTIME_URL", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL"]) {
              const value = process.env[name];
              if (!value) throw new Error("Artifact runtime unavailable: " + name);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Repeat source gate then request exact OIDC role
        run: python3 -m tools.cnesdata_delivery.apply_gate credentials
      - name: Execute under CAS watchdog and verify final publication
        id: gate
        run: python3 -m tools.cnesdata_delivery.apply_gate execute
