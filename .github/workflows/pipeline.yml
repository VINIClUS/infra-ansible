---
name: Validate and deploy

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Explicitly authorize production deployment after validation
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('pipeline-pr-{0}', github.event.pull_request.number)
    || format('pipeline-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: -r tools/ci/requirements-ci.txt
          ansible-galaxy collection install --requirements-file requirements.yml

      - name: Permit isolated native user namespaces on hosted validation
        shell: bash
        run: bash tools/ci/prepare-hosted-userns.sh

      - name: Prepare pinned offline native-test toolchain
        shell: bash
        run: >-
          python -m tools.ci.native_bootstrap
          --destination "${RUNNER_TEMP}/cnesdata-native"
          --github-env "${GITHUB_ENV}"
          --github-path "${GITHUB_PATH}"

      - name: Run Python tests (public context; external targets reported)
        shell: bash
        env:
          CNESDATA_NATIVE_CONTEXT: public-ci
        run: >-
          python -m pytest -q -ra --durations=0 -n 4 --dist loadgroup
          --junitxml "${RUNNER_TEMP}/ci-report/junit.xml"
          -p tools.ci.pytest_ci --ci-report-dir "${RUNNER_TEMP}/ci-report"
          --ci-quarantine exclude

      - name: Run quarantined tests (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          CNESDATA_NATIVE_CONTEXT: public-ci
        run: |
          status=0
          python -m pytest -q -ra -p tools.ci.pytest_ci --ci-quarantine only \
            --ci-report-dir "${RUNNER_TEMP}/ci-quarantine" || status=$?
          if [ "${status}" -eq 5 ]; then status=0; fi
          exit "${status}"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-report-validate
          path: |
            ${{ runner.temp }}/ci-report
            ${{ runner.temp }}/ci-quarantine
          if-no-files-found: warn
          overwrite: true

      - name: Validate repository scaffolds
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File tests/Validate-InfraAnsibleScaffold.ps1
          pwsh -NoProfile -File tests/Validate-AnsibleContainer.ps1
          pwsh -NoProfile -File tests/Validate-ProxmoxBackupStorageRole.ps1

      - name: Validate reusable runner role matrix
        shell: pwsh
        run: pwsh -NoProfile -File tests/Validate-GitHubRunnerMatrix.ps1

      - name: Parse the public example inventory
        shell: bash
        run: ansible-inventory -i inventories/example/hosts.yml --list

      - name: Syntax-check every playbook
        shell: bash
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventories/example/hosts.yml "${playbook}" --syntax-check
          done

      - name: Lint repository YAML and Ansible
        shell: bash
        run: |
          set -euo pipefail
          yamllint .
          ansible-lint .

      - name: Build and smoke-test the Ansible tool image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "infra-ansible-tools:${GITHUB_SHA}" --file tools/ansible/Dockerfile .
          docker run --rm "infra-ansible-tools:${GITHUB_SHA}" --version

      - name: Build the immutable release manifest
        shell: bash
        run: python tools/release/build_release_manifest.py "${GITHUB_SHA}" release-manifest.json

      - name: Upload the release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error

  proof:
    name: Proof ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [serial, xdist-a, xdist-b, xdist-hog, order-reverse, order-seed]
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r tools/ci/requirements-ci.txt
          ansible-galaxy collection install --requirements-file requirements.yml

      - name: Permit isolated native user namespaces on hosted validation
        shell: bash
        run: bash tools/ci/prepare-hosted-userns.sh

      - name: Prepare pinned offline native-test toolchain
        shell: bash
        run: >-
          python -m tools.ci.native_bootstrap
          --destination "${RUNNER_TEMP}/cnesdata-native"
          --github-env "${GITHUB_ENV}"
          --github-path "${GITHUB_PATH}"

      - name: Run the proof lane
        shell: bash
        env:
          CNESDATA_NATIVE_CONTEXT: public-ci
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          report="${RUNNER_TEMP}/proof-report"
          mkdir -p "${report}"
          python -m pytest --collect-only -q -p no:cacheprovider tests | grep '::' > "${report}/ground-truth.txt"
          plugin="-p tools.ci.pytest_ci --ci-report-dir ${report}/lane"
          split=$(python -c "import json;print(' '.join(json.load(open('tools/ci/xdist_splittable.json'))))")
          case "${LANE}" in
            serial) args="${plugin} tests" ;;
            xdist-a|xdist-b) args="-n 4 --dist loadgroup ${plugin} tests" ;;
            xdist-hog)
              yes > /dev/null &
              yes > /dev/null &
              args="-n 4 --dist loadgroup ${plugin} tests" ;;
            order-reverse) args="${plugin} --ci-order reverse ${split}" ;;
            order-seed) args="${plugin} --ci-order seed:20261120 ${split}" ;;
          esac
          read -ra argv <<< "${args}"
          /usr/bin/time -v -o "${report}/rss.txt" python -m pytest -q -ra -p no:cacheprovider "${argv[@]}" \
            > "${report}/pytest.txt" 2>&1
          echo "exit=$?" >> "${report}/rss.txt"
          grep -E "Maximum resident|exit=" "${report}/rss.txt" || true
          tail -3 "${report}/pytest.txt"
          pkill yes || true
          exit 0

      - name: Upload proof lane
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-proof-${{ matrix.lane }}
          path: ${{ runner.temp }}/proof-report
          if-no-files-found: error
          overwrite: true

  proof-compare:
    name: Proof compare
    needs: proof
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download proof lanes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-proof-*
          path: proof

      - name: Compare lanes
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python tools/ci/compare_results.py proof/ci-proof-serial/lane proof/ci-proof-xdist-a/lane \
            proof/ci-proof-xdist-b/lane proof/ci-proof-xdist-hog/lane \
            --ground-truth proof/ci-proof-serial/ground-truth.txt || status=1
          python - <<'PY'
          import json
          import pathlib

          files = set(json.load(open("tools/ci/xdist_splittable.json")))
          source = pathlib.Path("proof/ci-proof-serial/lane/results.jsonl")
          target = pathlib.Path("proof/serial-split")
          target.mkdir()
          rows = [line for line in source.read_text().splitlines() if json.loads(line)["file"] in files]
          (target / "results.jsonl").write_text("\n".join(rows) + "\n")
          PY
          python tools/ci/compare_results.py proof/serial-split proof/ci-proof-order-reverse/lane \
            proof/ci-proof-order-seed/lane || status=1
          for lane in proof/ci-proof-*; do
            echo "${lane}: $(grep -E 'Maximum resident' "${lane}/rss.txt")"
          done
          exit "${status}"

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'VINIClUS/infra-ansible' &&
      inputs.deploy_production == true
    runs-on: [self-hosted, linux, x64, ansible-prod]
    environment: production
    concurrency:
      group: ansible-production
      cancel-in-progress: false
    steps:
      - name: Download the validated release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-manifest
          path: .release

      - name: Verify the release manifest targets this revision
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(".release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("infra_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("release manifest SHA does not match GITHUB_SHA")
          PY

      - name: Deploy the validated revision
        shell: bash
        run: sudo /usr/local/sbin/infra-ansible-deploy "$GITHUB_SHA"
