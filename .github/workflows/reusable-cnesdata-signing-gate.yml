                  and item["revision"] == pin
                  and item["path"] == path
              ]
              assert len(entries) == 1
              item = get(producer + "/contents/" + path + "?ref=" + pin)
              assert (
                  item["type"] == "file" and item["encoding"] == "base64" and item["path"] == path
              )
              body = base64.b64decode(item["content"].replace("\n", ""), validate=True)
              assert 0 < len(body) <= 262144 and len(body) == item["size"]
              assert hashlib.sha256(body).hexdigest() == entries[0]["sha256"]
              assert (
                  hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest()
                  == item["sha"]
              )
              target = root / name
              assert not target.is_symlink()
              target.write_bytes(body)
          PYBOOT
      - name: Install checksum-locked protected SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/ext2-python"
          "${RUNNER_TEMP}/ext2-python/bin/pip" install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r tools/cnesdata_delivery/runtime-requirements.txt
          echo "${RUNNER_TEMP}/ext2-python/bin" >> "${GITHUB_PATH}"
      - name: Verify source, request and consumer closure without AWS credentials
        run: python3 -m tools.cnesdata_delivery.signing_gate preflight
      - name: Sign once after authenticated Phase A and verify three S3 versions
        run: python3 -m tools.cnesdata_delivery.signing_gate sign
      - name: Publish only the receipt commitment
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ext2-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ext2-public/receipt-ref.json
          if-no-files-found: error
          overwrite: false
      - name: Commit EXT2 artifact reference
        id: commit
        env:
          EXT2_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          EXT2_ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
        run: python3 -m tools.cnesdata_delivery.signing_gate publish-commit
    needs: validate-no-creds
    if: ${{ inputs.mode == 'activation' }}
    outputs:
      ext2_post_upload_receipt_v1: ${{ steps.commit.outputs.ext2_post_upload_receipt_v1 }}
  verify-handoff:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    env:
      CNESDATA_DELIVERY_GOVERNANCE: ${{ secrets.CNESDATA_DELIVERY_GOVERNANCE }}
      EXT2_POST_UPLOAD_RECEIPT: ${{ needs.sign-store-publish.outputs.ext2_post_upload_receipt_v1 }}
    steps:
      - name: Set pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Load actual immutable EXT2 producer from authenticated attempt
