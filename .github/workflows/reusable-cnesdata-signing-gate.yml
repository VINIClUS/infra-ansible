          assert re.fullmatch("[1-9][0-9]{0,19}", run_id) and re.fullmatch(
              "[1-9][0-9]{0,19}", attempt
          )
          raw = os.environ["CNESDATA_DELIVERY_GOVERNANCE"].encode()
          assert 0 < len(raw) <= 65536
          gov = json.loads(raw)["ext2"]
          assert gov["activation_enabled"] is True


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def get(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + path,
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
