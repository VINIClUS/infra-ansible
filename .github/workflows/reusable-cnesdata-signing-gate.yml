      - name: Verify source, request and consumer closure without AWS credentials
        run: python3 -m tools.cnesdata_delivery.signing_gate preflight
      - name: Read original publisher and versions using a read-only session
        id: verify
        run: python3 -m tools.cnesdata_delivery.signing_gate verify
    needs:
      - validate-no-creds
      - sign-store-publish
    if: >-
      ${{ always() && needs.validate-no-creds.result == 'success' && ((inputs.mode == 'activation' &&
      needs.sign-store-publish.result == 'success') || (inputs.mode == 'historical' && needs.sign-store-publish.result
      == 'skipped')) }}
    outputs:
      ext2_post_upload_receipt_v1: ${{ steps.verify.outputs.ext2_post_upload_receipt_v1 }}
