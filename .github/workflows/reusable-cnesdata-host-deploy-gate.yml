---
name: CnesData host deploy gate

"on":
  workflow_call:
    inputs:
      plan_evidence_id:
        required: true
        type: string
      plan_evidence_digest:
        required: true
        type: string
      plan_run_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_digest:
        required: true
        type: string
    secrets:
      host_governance:
        description: Original owner-approved private handoff and source pins, without runtime credentials
        required: true
    outputs:
      status:
        value: ${{ jobs.execute.outputs.status }}
      host_evidence_version:
        value: ${{ jobs.execute.outputs.host_evidence_version }}
      host_evidence_sha256:
        value: ${{ jobs.execute.outputs.host_evidence_sha256 }}
      platform_evidence_version:
        value: ${{ jobs.execute.outputs.platform_evidence_version }}
      platform_evidence_sha256:
        value: ${{ jobs.execute.outputs.platform_evidence_sha256 }}

permissions: {}

env:
  PLAN_EVIDENCE_ID: ${{ inputs.plan_evidence_id }}
  PLAN_EVIDENCE_DIGEST: ${{ inputs.plan_evidence_digest }}
  PLAN_RUN_ID: ${{ inputs.plan_run_id }}
  ARTIFACT_ID: ${{ inputs.artifact_id }}
  ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
  CNESDATA_HOST_GOVERNANCE: ${{ secrets.host_governance }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
    steps:
      - name: Authenticate actual immutable producer and run preflight without OIDC
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const cp = require("child_process");
            const env = {...process.env};
            for (const key of Object.keys(env)) if (key.startsWith("INPUT_") || key === "GITHUB_TOKEN") delete env[key];
            const crypto = require("crypto");
            const g = JSON.parse(process.env.CNESDATA_HOST_GOVERNANCE);
            if (context.repo.owner !== "VINIClUS" || context.repo.repo !== "CnesData" ||
                context.eventName !== "workflow_dispatch" || context.ref !== "refs/heads/develop") {
              throw new Error("Manual source required");
            }
            const {data: run} = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT)
            });
            const path = "VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-host-deploy-gate.yml";
            const refs = run.referenced_workflows.filter(r => r.path.startsWith(path + "@"));
            if (refs.length !== 1 || !/^[a-f0-9]{40}$/.test(refs[0].sha) ||
                refs[0].path !== path + "@" + refs[0].sha ||
                refs[0].sha !== g.binding.approval.reusable_sha) throw new Error("Producer pin");
            const {data: source} = await github.rest.repos.getContent({
              owner: "VINIClUS", repo: "infra-ansible", path: "tools/cnesdata_delivery/host_gate.py", ref: refs[0].sha
            });
            const raw = Buffer.from(source.content, "base64");
            if (crypto.createHash("sha256").update(raw).digest("hex") !== g.runtime_sha256) {
              throw new Error("Runtime pin");
            }
            fs.writeFileSync("host_gate.py", raw, {mode: 0o600});
            const {data: contract} = await github.rest.repos.getContent({
              owner: "VINIClUS", repo: "infra-ansible", path: "tools/cnesdata_delivery/contract.py", ref: refs[0].sha
            });
            fs.writeFileSync("contract.py", Buffer.from(contract.content, "base64"), {mode: 0o600});
            const result = cp.spawnSync("python3", ["-I", "host_gate.py", "--runner", "preflight"],
              {env, input: core.getInput("github-token", {required: true}),
               stdio: ["pipe", "inherit", "inherit"], timeout: 540000});
            if (result.status !== 0) throw new Error("Host preflight rejected");

  execute:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      checks: read
      id-token: write
    outputs:
      status: ${{ steps.gate.outputs.status }}
      host_evidence_version: ${{ steps.gate.outputs.host_evidence_version }}
      host_evidence_sha256: ${{ steps.gate.outputs.host_evidence_sha256 }}
      platform_evidence_version: ${{ steps.gate.outputs.platform_evidence_version }}
      platform_evidence_sha256: ${{ steps.gate.outputs.platform_evidence_sha256 }}
    steps:
      - name: Reload the authenticated producer and checksum-locked SDK closure
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const cp = require("child_process");
            const env = {...process.env};
            for (const key of Object.keys(env)) if (key.startsWith("INPUT_") || key === "GITHUB_TOKEN") delete env[key];
            const crypto = require("crypto");
            const g = JSON.parse(process.env.CNESDATA_HOST_GOVERNANCE);
            if (context.repo.owner !== "VINIClUS" || context.repo.repo !== "CnesData" ||
                context.eventName !== "workflow_dispatch" || context.ref !== "refs/heads/develop") {
              throw new Error("Manual source required");
            }
            const {data: run} = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT)
            });
            const path = "VINIClUS/infra-ansible/.github/workflows/reusable-cnesdata-host-deploy-gate.yml";
            const refs = run.referenced_workflows.filter(r => r.path.startsWith(path + "@"));
            if (refs.length !== 1 || !/^[a-f0-9]{40}$/.test(refs[0].sha) ||
                refs[0].path !== path + "@" + refs[0].sha ||
                refs[0].sha !== g.binding.approval.reusable_sha) throw new Error("Producer pin");
            for (const name of ["host_gate.py", "contract.py", "runtime-requirements.txt"]) {
              const {data: source} = await github.rest.repos.getContent({
                owner: "VINIClUS", repo: "infra-ansible", path: "tools/cnesdata_delivery/" + name, ref: refs[0].sha
              });
              const raw = Buffer.from(source.content, "base64");
              if (name === "host_gate.py" &&
                  crypto.createHash("sha256").update(raw).digest("hex") !== g.runtime_sha256) {
              throw new Error("Runtime pin");
            }
              fs.writeFileSync(name, raw, {mode: 0o600});
            }
            const result = cp.spawnSync("python3", ["-I", "host_gate.py", "--runner", "preflight"],
              {env, input: core.getInput("github-token", {required: true}),
               stdio: ["pipe", "inherit", "inherit"], timeout: 540000});
            if (result.status !== 0) throw new Error("Repeated preflight rejected");
      - name: Install the pinned hosted-only SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/host-python"
          "${RUNNER_TEMP}/host-python/bin/pip" install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r runtime-requirements.txt
      - name: Repeat source gate before OIDC and exchange exactly three SSH frames
        id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const cp = require("child_process");
            const env = {...process.env};
            for (const key of Object.keys(env)) if (key.startsWith("INPUT_") || key === "GITHUB_TOKEN") delete env[key];
            const path = require("path");
            const result = cp.spawnSync(path.join(process.env.RUNNER_TEMP, "host-python/bin/python"),
              ["-I", "host_gate.py", "--runner", "execute"],
              {env, input: core.getInput("github-token", {required: true}),
               stdio: ["pipe", "inherit", "inherit"], timeout: 2100000});
            // A verified recovery diagnostic is persisted and projected before
            // failing the job. Never publish stdout or the private SSH response.
            if (result.status !== 0 && result.status !== 2) throw new Error("Host transport failed");
      - name: Publish only the closed public handoff projection
        id: handoff
        if: ${{ always() && steps.gate.outputs.host_evidence_sha256 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cnesdata-host-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cnesdata-host-public/host-handoff.json
          if-no-files-found: ignore # validate produces no promotion handoff
          retention-days: 1
          overwrite: false
      - name: Fail only after the original recovery handoff is available
        if: ${{ always() && (steps.gate.outputs.status != 'accepted' || steps.handoff.outcome == 'failure') }}
        shell: bash
        run: exit 1
